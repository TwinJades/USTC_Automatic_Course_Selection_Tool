name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install release tooling
        run: python -m pip install -r tools/release/requirements.txt

      - name: Validate tag, build, check, and package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/release/Publish-Release.ps1 -Tag $env:RELEASE_TAG

      - name: Create draft, upload ZIP, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "release/USTC_Automatic_Course_Selection_Tool_$version.zip"
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "USTC 选课助手 $version" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Creating draft release failed ($LASTEXITCODE)." }
          gh release upload $env:RELEASE_TAG $archive
          if ($LASTEXITCODE -ne 0) { throw "Uploading release ZIP failed ($LASTEXITCODE). Draft retained for inspection." }
          $raw = gh release view $env:RELEASE_TAG --json assets,body,isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw "Reading uploaded draft failed ($LASTEXITCODE)." }
          $release = $raw | ConvertFrom-Json
          $assets = @($release.assets)
          $expectedNotes = (Get-Content artifacts/release-notes.md -Raw).Trim()
          if (-not $release.isDraft -or $release.tagName -cne $env:RELEASE_TAG -or $assets.Count -ne 1 -or
              $assets[0].name -cne (Split-Path $archive -Leaf) -or $assets[0].size -ne (Get-Item $archive).Length -or
              $release.body.Trim() -cne $expectedNotes) {
            throw 'Uploaded draft metadata does not match the validated package and notes.'
          }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Publishing release failed ($LASTEXITCODE)." }
          $published = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft) { throw 'Release was not published successfully.' }
