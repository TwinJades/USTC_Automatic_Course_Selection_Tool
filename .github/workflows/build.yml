name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore UstcCourseAssistant.sln

      - name: Build
        run: dotnet build UstcCourseAssistant.sln --configuration Release --no-restore

      - name: Run offline regression checks
        run: dotnet run --project tests/UstcCourseAssistant.Route2.EngineChecks --configuration Release --no-build

      - name: Run offline regression checks
        run: dotnet run --project tests/UstcCourseAssistant.Route2.EngineChecks --configuration Release --no-build
        env:
          USTC_ROUTE2_UI_TIMING_SCALE: 5
