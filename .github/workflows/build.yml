name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UstcCourseAssistant.sln

      - name: Build
        run: dotnet build UstcCourseAssistant.sln --configuration Release --no-restore

      - name: Run CI-safe offline regression checks
        run: dotnet run --project tests/UstcCourseAssistant.Route2.EngineChecks --configuration Release --no-build -- --skip-ui

      - name: Run shared-core behavioral checks
        run: dotnet run --project tests/UstcCourseAssistant.CoreChecks --configuration Release --no-build

  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build Linux CLI
        run: dotnet build src/UstcCourseAssistant.Cli --configuration Release
      - name: Run shared-core checks
        run: dotnet run --project tests/UstcCourseAssistant.CoreChecks --configuration Release
      - name: Verify package security boundaries
        run: python -m unittest discover -s tools/release -p test_package_directory.py
